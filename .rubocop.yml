# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

plugins:
  - rubocop-rspec

# Claude Code worktrees are separate checkouts nested in this directory; lint them there, not here.
inherit_mode:
  merge:
    - Exclude
AllCops:
  Exclude:
    - ".claude/worktrees/**/*"

RSpec:
  Enabled: true

# Pending rubocop-rspec cops are not switched on by the department-level
# `Enabled: true` above; opt in explicitly so none are silently skipped.
RSpec/DiscardedMatcher:
  Enabled: true
RSpec/IncludeExamples:
  Enabled: true
RSpec/LeakyLocalVariable:
  Enabled: true
RSpec/MatchWithSimpleRegex:
  Enabled: true
RSpec/Output:
  Enabled: true

# The network-isolation spec verifies the test harness (WebMock/VCR), not a
# class, so a string describe is intentional there, and the project-config spec
# checks repository files, not a class. The hook spec exercises a git hook
# script, and the collector rake spec a rake task, not a class. The image
# publishing spec checks the publishing files, and the admin catalog core and
# footer core specs and the import preview's core spec the files of a page, the
# number entry core spec those of a feature. The export format specs check the
# format's document, schema and example files. The request body limit spec
# checks server configuration files.
RSpec/DescribeClass:
  Exclude:
    - "spec/admin_catalog_core_spec.rb"
    - "spec/collection_export_core_spec.rb"
    - "spec/collection_import_core_spec.rb"
    - "spec/config/request_body_limit_spec.rb"
    - "spec/design_system_files_spec.rb"
    - "spec/export_format_document_spec.rb"
    - "spec/export_format_examples_spec.rb"
    - "spec/footer_core_spec.rb"
    - "spec/githooks/post_checkout_spec.rb"
    - "spec/image_publishing_spec.rb"
    - "spec/import_apply_core_spec.rb"
    - "spec/network_isolation_spec.rb"
    - "spec/number_entry_core_spec.rb"
    - "spec/project_config_spec.rb"
    - "spec/tasks/collector_rake_spec.rb"

# Integration-style examples need setup → act → assert; the default 5 lines is too tight.
# The apply, plan and round-trip specs of spec 028 are scenarios (a collection, a file, a stored upload, an apply, then
# the collection again); their examples and helpers are longer and more numerous than the integration default.
RSpec/ExampleLength:
  Max: 15
  Exclude:
    - "spec/models/collection_import/apply_spec.rb"
    - "spec/models/collection_import/plan_spec.rb"
    - "spec/models/collection_import/round_trip_spec.rb"
RSpec/MultipleMemoizedHelpers:
  Exclude:
    - "spec/models/collection_import/apply_spec.rb"
    - "spec/models/collection_import/round_trip_spec.rb"
