# The third-party software and assets in the image that aren't gems, with their licences (spec 087, decisions 3 and 5).
# The gems are read from the running bundle; nothing here is generated. Every fact below was read from the source its
# `source` names, on 2026-11-13, and no copyright line or licence text is written from memory: where a source has none,
# the entry has none (decision 5). A change to a pinned engine package, a served JavaScript file, a font file or an icon
# file fails spec/third_party_licences_manifest_spec.rb until its entry is looked at (decision 3's guard).
#
# Keys: `name`, `version`, `spdx`, `home`, `copyright` (optional), `source`; `texts` (a `title` and a `file` in
# config/third_party_licences/) or `text: none` with a `reason` (an entry with a `gem` takes its text from that gem's
# licence files); `note` (optional, shown after the identifier); the kind's own keys: `sha256` (ocr), `gem`,
# `gem_version`, `pins`, `files` (javascript, fonts, icons).

