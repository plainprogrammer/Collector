<title>AddProxy</title>

<body>
<div class="c-shell">
<header class="c-appbar c-appbar--detail">
  <a class="c-btn c-btn--ghost c-btn--icon c-appbar__back" href="#" aria-label="Back to Izzet Tempo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  <a class="c-appbar__brand" href="#" aria-label="Collector home">
    <span class="c-appbar__wordmark"><img class="c-logo--light" src="../../../app/assets/images/collector/collector-wordmark.svg" alt=""><img class="c-logo--dark" src="../../../app/assets/images/collector/collector-wordmark-reversed.svg" alt=""></span>
    <span class="c-appbar__mark"><img class="c-logo--light" src="../../../app/assets/images/collector/collector-mark.svg" alt=""><img class="c-logo--dark" src="../../../app/assets/images/collector/collector-mark-reversed.svg" alt=""></span>
  </a>
  <nav class="c-appbar__nav" aria-label="Main"><a href="#">Collection</a><a href="#" aria-current="page">Decks</a><a href="#">Search</a><a href="#">Scan</a><a href="#">Locations</a></nav>
  <div class="c-appbar__actions">
    <details class="c-menu"><summary class="c-avatar" aria-label="Account: James">J</summary>
      <div class="c-menu__list"><a class="c-menu__item" href="#">Profile</a><a class="c-menu__item" href="#">Settings</a><a class="c-menu__item" href="#">Import and export</a><div class="c-menu__sep"></div><a class="c-menu__item" href="#">Sign out</a></div>
    </details>
  </div>
</header>
<main class="c-main c-page c-decks">
  <div class="c-pagehead">
    <div>
      <h1 class="c-pagehead__title">Add a proxy to Izzet Tempo › Main</h1>
      <p class="c-pagehead__stats">Lightning Bolt <span class="is-data">MH2 · 138</span></p>
    </div>
  </div>
  <form class="c-form" action="#" method="post">
    <input type="hidden" name="proxy[entry]" value="…">
    <div class="c-field">
      <label class="c-field__label" for="proxy_finish">Finish</label>
      <select id="proxy_finish" name="proxy[finish]" required>
        <option value="">Choose…</option>
        <option value="nonfoil">Nonfoil</option>
        <option value="foil">Foil</option>
      </select>
    </div>
    <div class="c-field c-field--invalid">
      <label class="c-field__label" for="proxy_quantity">Quantity</label>
      <label class="c-input"><input type="number" id="proxy_quantity" name="proxy[quantity]" min="1" max="9999" step="1" value="0" inputmode="numeric" required aria-describedby="proxy_quantity-error"></label>
      <p class="c-field__error" id="proxy_quantity-error">Enter a number from 1 to 9,999.</p>
    </div>
    <div class="c-form__actions">
      <input type="submit" value="Add proxy" class="c-btn c-btn--primary">
      <a class="c-btn c-btn--secondary" href="#">Cancel</a>
    </div>
  </form>
</main>
