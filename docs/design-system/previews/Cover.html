<!doctype html>
<html lang="en" data-theme="light">
<head>
<link rel="stylesheet" href="preview-fonts.css"><link rel="stylesheet" href="../../../app/assets/stylesheets/collector/tokens.css"><link rel="stylesheet" href="../../../app/assets/stylesheets/collector/components.css">
<meta charset="utf-8">
<title>Collector</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; }
  .brand { fill:var(--brand); }
  .tint { fill:var(--brand-tint); }
  .deep { fill:var(--ink); }
  .sunken { fill:var(--surface-sunken); }
  .blk { rx:var(--radius-md); }
  .slot { rx:var(--radius-sm); }
  .slot.foil { fill:var(--foil); }
  .slot.empty { fill:var(--surface-raised); stroke:var(--line); stroke-width:1; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:88px; line-height:.92; font-weight:600; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      brand 128x232 slab bled off the top (the identity colour, biggest) · surface-sunken binder page 176x233 · ink 144x176 bleeding off the right · brand-tint 64x56 relief — ~35% of 960x288
  arrangement one tall teal slab, a binder page beside it, an ink block and a tint satellite; bottoms on one line space-4 above the edge, space-4 gutters
  pattern     literal motif: a 3x3 binder page of card slots at the physical 63:88 ratio, partly filled (brand), one foil, three empty (surface-raised) — this is a collection app, the slot IS the brand
  scales      gutters space-4, slot gap space-2, page padding space-2; blocks radius-md, slots radius-sm
-->
<rect class="brand blk" x="16" y="-16" width="128" height="288" rx="8"/>
<rect class="sunken blk" x="160" y="39" width="176" height="233" rx="8"/>
<rect class="slot brand" x="168" y="47" width="48" height="67" rx="4"/>
<rect class="slot brand" x="224" y="47" width="48" height="67" rx="4"/>
<rect class="slot foil" x="280" y="47" width="48" height="67" rx="4"/>
<rect class="slot brand" x="168" y="122" width="48" height="67" rx="4"/>
<rect class="slot empty" x="224" y="122" width="48" height="67" rx="4"/>
<rect class="slot brand" x="280" y="122" width="48" height="67" rx="4"/>
<rect class="slot empty" x="168" y="197" width="48" height="67" rx="4"/>
<rect class="slot brand" x="224" y="197" width="48" height="67" rx="4"/>
<rect class="slot empty" x="280" y="197" width="48" height="67" rx="4"/>
<rect class="tint blk" x="352" y="24" width="64" height="56" rx="8"/>
<rect class="deep blk" x="352" y="96" width="144" height="176" rx="8"/>
</svg>
</div>
<div class="words">
<h1 class="name">Collector</h1>
<p class="tag">A free, open catalog for the things you keep — card by card, issue by issue.</p>
</div>
</div>
<script>/* preview only: ?theme=dark */ if(new URLSearchParams(location.search).get("theme")==="dark")document.documentElement.dataset.theme="dark";</script>
</body>
</html>
