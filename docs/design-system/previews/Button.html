<!doctype html>
<html lang="en" data-theme="light"><head>
<link rel="stylesheet" href="preview-fonts.css"><link rel="stylesheet" href="../../../app/assets/stylesheets/collector/tokens.css"><link rel="stylesheet" href="../../../app/assets/stylesheets/collector/components.css"><meta charset="utf-8">
<style>
  body { margin:0; padding:var(--space-4); background:var(--surface); color:var(--ink); font-family:var(--font-sans); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-3); }
  .stack { display:flex; flex-direction:column; gap:var(--space-4); }
  .cap { font:600 12px/16px var(--font-sans); color:var(--ink-muted); margin:0 0 var(--space-2); }
  
</style></head>
<body>
<div class="stack">
<div class="row">
  <button class="c-btn c-btn--primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add to collection</button>
  <button class="c-btn c-btn--secondary">Move to deck</button>
  <button class="c-btn c-btn--ghost">Show all printings</button>
  <button class="c-btn c-btn--danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Remove</button>
</div>
<div class="row">
  <button class="c-btn c-btn--primary c-btn--sm">Save</button>
  <button class="c-btn c-btn--secondary c-btn--sm">Cancel</button>
  <button class="c-btn c-btn--secondary c-btn--sm c-btn--icon" aria-label="More actions"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  <button class="c-btn c-btn--primary c-btn--sm" disabled>Saving…</button>
</div></div>
<script>/* preview only: ?theme=dark */ if(new URLSearchParams(location.search).get("theme")==="dark")document.documentElement.dataset.theme="dark";</script>
</body></html>
