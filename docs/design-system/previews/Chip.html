<!doctype html>
<html lang="en" data-theme="light"><head>
<link rel="stylesheet" href="preview-fonts.css"><link rel="stylesheet" href="../../../app/assets/stylesheets/collector/tokens.css"><link rel="stylesheet" href="../../../app/assets/stylesheets/collector/components.css"><meta charset="utf-8">
<style>
  body { margin:0; padding:var(--space-4); background:var(--surface); color:var(--ink); font-family:var(--font-sans); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-3); }
  .stack { display:flex; flex-direction:column; gap:var(--space-4); }
  .cap { font:600 12px/16px var(--font-sans); color:var(--ink-muted); margin:0 0 var(--space-2); }
  
</style></head>
<body>
<div class="stack">
<div class="row">
  <span class="c-chip c-chip--cards"><span class="c-chip__dot"></span>Trading cards</span>
  <span class="c-chip c-chip--comics"><span class="c-chip__dot"></span>Comics</span>
  <span class="c-chip c-chip--other"><span class="c-chip__dot"></span>Board games</span>
  <span class="c-tag">MH3 · 214</span><span class="c-tag">NM</span>
</div>
<div class="row">
  <button class="c-filter" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Owned</button>
  <button class="c-filter" aria-pressed="false">Foil</button>
  <button class="c-filter" aria-pressed="false">In a deck</button>
  <button class="c-filter" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>More filters</button>
