<body>
<div class="c-shell">
<header class="c-appbar c-appbar--detail">
  <a class="c-btn c-btn--ghost c-btn--icon c-appbar__back" href="#" aria-label="Back to Lightning Bolt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  <a class="c-appbar__brand" href="#" aria-label="Collector home">
    <span class="c-appbar__wordmark"><img class="c-logo--light" src="../../../app/assets/images/collector/collector-wordmark.svg" alt=""><img class="c-logo--dark" src="../../../app/assets/images/collector/collector-wordmark-reversed.svg" alt=""></span>
    <span class="c-appbar__mark"><img class="c-logo--light" src="../../../app/assets/images/collector/collector-mark.svg" alt=""><img class="c-logo--dark" src="../../../app/assets/images/collector/collector-mark-reversed.svg" alt=""></span>
  </a>
  <nav class="c-appbar__nav" aria-label="Main"><a href="#">Collection</a><a href="#" aria-current="page">Decks</a><a href="#">Search</a><a href="#">Scan</a><a href="#">Locations</a></nav>
  <div class="c-appbar__actions">
    <details class="c-menu"><summary class="c-avatar" aria-label="Account: James">J</summary>
      <div class="c-menu__list"><a class="c-menu__item" href="#">Profile</a><a class="c-menu__item" href="#">Settings</a><a class="c-menu__item" href="#">Import and export</a><div class="c-menu__sep"></div><a class="c-menu__item" href="#">Sign out</a></div>
    </details>
  </div>
</header>
<main class="c-main c-page c-decks">
  <div class="c-pagehead"><div><h1 class="c-pagehead__title">Add Lightning Bolt to a deck</h1></div></div>
  <form class="c-form" action="/catalog/entries/…/deck_additions" method="post">
    <div class="c-field">
      <label class="c-field__label" for="deck_zone">Deck and zone</label>
      <select id="deck_zone" name="zone_id" required>
        <option value="">Choose a deck and zone…</option>
        <optgroup label="Decks"><option value="1">Izzet Tempo › Main</option><option value="2">Izzet Tempo › Sideboard</option><option value="3">Izzet Tempo › Considering</option></optgroup>
      </select>
    </div>
    <div class="c-field">
      <label class="c-field__label" for="how_many">How many</label>
      <label class="c-input"><input type="number" id="how_many" name="quantity" min="1" value="1" inputmode="numeric"></label>
    </div>
    <fieldset class="c-choices c-pick">
      <legend class="c-field__label">What to use</legend>
      <label class="c-check"><input required type="radio" value="copies" name="use">My copies (3 free: 2 in Blue binder, 1 in Red box)</label>
      <label class="c-check"><input required type="radio" value="proxy:nonfoil" name="use">A proxy of <span class="is-data">2X2 · 117</span> Nonfoil</label>
      <label class="c-check"><input required type="radio" value="proxy:foil" name="use">A proxy of <span class="is-data">2X2 · 117</span> Foil</label>
    </fieldset>
    <div class="c-form__actions">
      <input type="submit" value="Add to deck" class="c-btn c-btn--primary">
      <a class="c-btn c-btn--secondary" href="/catalog/entries/…">Cancel</a>
    </div>
  </form>
</main>
