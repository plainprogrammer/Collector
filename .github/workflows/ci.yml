name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run bin/ci
        run: bin/ci

      - name: Keep screenshots from failed system specs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: tmp/capybara
          if-no-files-found: ignore
