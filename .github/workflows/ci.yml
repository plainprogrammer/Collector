name: CI

on:
  pull_request:
  push:
    branches: [ main ]
    # Release tags only (docs/releasing.md): vX.Y.Z and vX.Y.Z-<pre-release>. Other tags run nothing.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# Only the image and publish jobs may write packages.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/plainprogrammer/collector

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: Run bin/ci checks
        run: bin/ci checks

  # RSpec in shards formed from spec/support/runtime_log.txt (spec 035 decisions 6, 7). The shard count is the
  # matrix's length; bin/ci rspec N/M prints the shard's seed and a replay command.
  rspec:
    name: RSpec (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: Install libvips (Active Storage variants, ADR 0013) and ImageMagick (art matching's decoder, ADR 0012)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libvips imagemagick

      - name: Run bin/ci rspec
        run: bin/ci rspec ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Keep screenshots from failed system specs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshots-${{ matrix.shard }}
          path: tmp/capybara
          if-no-files-found: ignore

  # The one verdict the image jobs wait for: every group passed (spec 035 decision 5; spec 012 FR-1).
  ci:
    needs: [ checks, rspec ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every group to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          RSPEC: ${{ needs.rspec.result }}
        run: test "$CHECKS" = success && test "$RSPEC" = success

  # Builds the image natively for each architecture (ADR 0010), smoke-tests it, and on main and release tags
  # pushes it by digest for the publish job to merge. Pull requests build and test but push nothing.
  image:
    name: Image (${{ matrix.platform }})
    needs: ci
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      BUNDLE_WITHOUT: development:test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Name the platform for cache and artifact keys
        id: platform
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The comparer is Ruby on the runner, neither release's code (decision 5).
      - name: Set up Ruby for the upgrade proof
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      # Tags per ADR 0009: edge and sha-<7 chars> on main; X.Y.Z, X.Y, latest and X (from 1 up) on vX.Y.Z;
      # only X.Y.Z-<pre> on pre-releases. Licence and description are set here, not read from the repository.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.description=Self-hostable, multi-tenant web app for tracking collectibles, starting with Magic: The Gathering cards.

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: collector:smoke
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.pair }}

      - name: Smoke test
        run: bin/image-smoke collector:smoke

      # Backs up a running container and restores the file into a second one under another secret, the ways the README
      # documents (spec 030, AC-5.2, AC-5.3).
      - name: Backup smoke test
        run: bin/backup-smoke collector:smoke

      # Boots the previous release's published image, seeds it, starts this build on the same volume and compares the two
      # databases and what the app serves (spec 031). It runs before the image is pushed, so a release tag that can't upgrade
      # the last release publishes nothing.
      - name: Upgrade smoke test
        timeout-minutes: 12
        run: bin/upgrade-smoke auto collector:smoke --platform ${{ matrix.platform }}

      # The login comes last: only the push needs the token, so no other action or test runs with it on disk (issue #132).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build from the cache, exported to the registry by digest (untagged) for the publish job.
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merges the two digests into one manifest list under the tags from docker/metadata-action, then checks it.
  publish:
    name: Publish manifest list
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.description=Self-hostable, multi-tenant web app for tracking collectibles, starting with Magic: The Gathering cards.

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      # AC-2.1: exactly linux/amd64 and linux/arm64, nothing else.
      - name: Check the manifest list
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}" --format '{{json .Manifest}}' \
            | jq -e '[.manifests[] | .platform.os + "/" + .platform.architecture] | sort == ["linux/amd64", "linux/arm64"]'
