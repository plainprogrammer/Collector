# Self-host Collector with Docker Compose (or podman compose).
# Required: SECRET_KEY_BASE (generate with: openssl rand -hex 64)
# Optional: COLLECTOR_PORT (host port, default 3000)
# Optional: COLLECTOR_MTG_LANGUAGES (extra card languages, e.g. "ja,de")
# Optional: COLLECTOR_CURRENCY (currency for the price you paid, default USD)
services:
  web:
    build: .
    image: collector:latest
    restart: unless-stopped
    ports:
      - "${COLLECTOR_PORT:-3000}:8080"
    environment:
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?SECRET_KEY_BASE is required (generate with: openssl rand -hex 64)}"
      SOLID_QUEUE_IN_PUMA: "true"
      HTTP_PORT: "8080"
      COLLECTOR_MTG_LANGUAGES: "${COLLECTOR_MTG_LANGUAGES:-}"
      COLLECTOR_CURRENCY: "${COLLECTOR_CURRENCY:-USD}"
    volumes:
      - collector_storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  collector_storage:
